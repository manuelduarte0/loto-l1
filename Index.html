<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOTO L1 - Analisador</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:Arial;padding:15px;text-align:center}
.card{background:#1e1e1e;border-radius:12px;padding:20px;max-width:500px;margin:20px auto;border:1px solid #333}
h1{color:#00ff88;margin:0 0 5px}
input{width:90%;padding:12px;border-radius:8px;border:none;margin:10px 0;text-align:center;font-size:16px}
button{background:#00ff88;color:#000;border:none;padding:12px 25px;border-radius:8px;font-weight:bold;font-size:16px;width:90%;cursor:pointer}
button:active{transform:scale(0.98)}
#res{margin-top:15px;text-align:left;background:#111;padding:15px;border-radius:8px;font-size:14px;line-height:1.6}
.linha{padding:5px;border-bottom:1px solid #222}
.ok{color:#00ff88}
.off{color:#666}
</style>
</head>
<body>
<h1>LOTO L1</h1>
<p>Analisador de Linhas</p>
<div class="card">
<input id="numeros" placeholder="Digite 20 numeros ex: 01 05 10...">
<button onclick="analisar()">ANALISAR L1</button>
<div id="res">Aguardando numeros...</div>
</div>
<script>
function analisar(){
 let txt=document.getElementById('numeros').value;
 let nums=txt.match(/\d+/g);
 if(!nums || nums.length<15){document.getElementById('res').innerHTML='Digite pelo menos 15 numeros';return}
 nums=nums.map(n=>parseInt(n)).filter(n=>n>=1 && n<=100);
 let res='';
 for(let l=0;l<10;l++){
   let ini=l*10+1;
   let fim=ini+9;
   let qtd=nums.filter(n=>n>=ini && n<=fim).length;
   let cls=qtd>=3?'ok':'off';
   res+='<div class="linha '+cls+'">Linha '+(l+1)+' ['+ini+'-'+fim+']: '+qtd+' numeros</div>';
 }
 let l1=nums.filter(n=>n>=1 && n<=10).length;
 res+='<br><b>L1 (1-10): '+l1+' numeros '+(l1>=2?'IDEAL':'BAIXO')+'</b>';
 document.getElementById('res').innerHTML=res;
}
</script>
</body>
</html>
